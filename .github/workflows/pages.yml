name: Deploy Command Vision to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate browser JavaScript
        run: |
          python3 - <<'PY'
          import re
          source = open("index.html", encoding="utf-8").read()
          scripts = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', source, re.S | re.I)
          if not scripts:
              raise SystemExit("No inline browser JavaScript found in index.html")
          open("/tmp/command-vision-check.js", "w", encoding="utf-8").write(scripts[-1])
          PY
          node --check /tmp/command-vision-check.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
