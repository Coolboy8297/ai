name: Deploy Command AI to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate browser JavaScript
        run: |
          python3 - <<'PY'
          import re
          source = open("index.html", encoding="utf-8").read()
          match = re.search(r'<script type="module">(.*?)</script>', source, re.S)
          if not match:
              raise SystemExit("Browser JavaScript module not found")
          open("/tmp/command-ai-check.mjs", "w", encoding="utf-8").write(match.group(1))
          PY
          node --check /tmp/command-ai-check.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
